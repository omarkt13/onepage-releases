# MCUboot: swap with revert, so a new image that fails to confirm itself
# rolls back to the previous one (firmware spec section 9).
# Swap mode comes from sysbuild (default: swap with revert).
CONFIG_LOG=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
# MCUboot keeps both image slots in internal RRAM; it needs no SPI flash driver.
CONFIG_SPI=n
CONFIG_SPI_NOR=n
