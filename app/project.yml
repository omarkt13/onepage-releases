# Generate the Xcode project with XcodeGen: `cd app && xcodegen generate`
name: OnePageMini

options:
  bundleIdPrefix: app.onepage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # PLACEHOLDER: your Apple team ID

packages:
  OnePageKit:
    path: OnePageKit
  McuManager:
    url: https://github.com/NordicSemiconductor/IOS-nRF-Connect-Device-Manager
    from: "1.6.0"

targets:
  OnePageMini:
    type: application
    platform: iOS
    sources:
      - path: OnePageMini
        excludes:
          - Resources/Info.plist
          - Resources/OnePageMini.entitlements
    dependencies:
      - package: OnePageKit
      - package: McuManager
        product: iOSMcuManagerLibrary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.onepage.mini
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: OnePageMini/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: OnePageMini/Resources/OnePageMini.entitlements
    info:
      path: OnePageMini/Resources/Info.plist
      properties:
        CFBundleDisplayName: OnePage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: >-
          OnePage uses Bluetooth to pair with your OnePage Mini and to send it books,
          weather and your calendar.
        NSCalendarsFullAccessUsageDescription: >-
          OnePage sends the next 7 days of events (start, end, title and place) to your
          OnePage Mini, so its Calendar screen works when the phone is away. Nothing goes
          to a server.
        NSLocationWhenInUseUsageDescription: >-
          OnePage uses your approximate location to get the weather for the device's Home
          screen. You can type a city instead.
        NSLocationDefaultAccuracyReduced: true
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: Plain text
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
    entitlements:
      path: OnePageMini/Resources/OnePageMini.entitlements
      properties:
        com.apple.developer.weatherkit: true
        com.apple.developer.associated-domains:
          - applinks:onepage.app   # PLACEHOLDER domain, see README

  OnePageMiniTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OnePageMiniTests
    dependencies:
      - target: OnePageMini
      - package: OnePageKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OnePageMini.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OnePageMini
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  OnePageMini:
    build:
      targets:
        OnePageMini: all
    test:
      targets:
        - OnePageMiniTests
        - package: OnePageKit/OnePageKitTests
